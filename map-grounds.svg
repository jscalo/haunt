<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1090" font-family="'Courier New', monospace">
  <defs>
    <style>
      .room { fill: #f0ece0; stroke: #5a4a2a; stroke-width: 2.5; rx: 8; }
      .room-outdoor { fill: #e8f5e8; stroke: #2a6a2a; stroke-width: 2.5; rx: 8; }
      .room-danger { fill: #fce8e8; stroke: #aa2222; stroke-width: 2.5; rx: 8; }
      .room-label { fill: #2a2010; font-size: 16px; font-weight: bold; text-anchor: middle; }
      .room-desc { fill: #5a5040; font-size: 11px; text-anchor: middle; }
      .treasure { fill: #9a7a00; font-size: 12px; text-anchor: middle; }
      .item { fill: #2a5a8a; font-size: 11px; text-anchor: middle; }
      .danger-text { fill: #bb2222; font-size: 11px; text-anchor: middle; }
      .connector { stroke: #5a4a2a; stroke-width: 2; fill: none; }
      .connector-special { stroke: #aa2222; stroke-width: 2; fill: none; stroke-dasharray: 4,3; }
      .connector-escape { stroke: #9a7a00; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .dir-label { fill: #7a6a4a; font-size: 10px; font-weight: bold; text-anchor: middle; }
      .area-label { fill: #5a4a2a; font-size: 18px; font-weight: bold; text-anchor: middle; letter-spacing: 3px; opacity: 0.35; }
      .title { fill: #2a2010; font-size: 34px; font-weight: bold; text-anchor: middle; letter-spacing: 5px; }
      .subtitle { fill: #5a5040; font-size: 13px; text-anchor: middle; letter-spacing: 2px; }
      .note { fill: #7a6a4a; font-size: 10px; text-anchor: middle; font-style: italic; }
      .whimsy { fill: #2a2010; font-size: 18px; text-anchor: middle; }
      .legend-text { fill: #4a4030; font-size: 11px; }
      .wall-label { fill: #2a6a2a; font-size: 12px; text-anchor: middle; font-weight: bold; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#9a7a00"/>
    </marker>
  </defs>

  <rect width="1200" height="1090" fill="#ffffff"/>

  <!-- Title -->
  <text x="600" y="42" class="title">H A U N T</text>
  <text x="600" y="62" class="subtitle">Part 1: The Mansion Grounds</text>
  <text x="380" y="42" class="whimsy" font-size="20" opacity="0.3">&#x1F987;</text>
  <text x="815" y="46" class="whimsy" font-size="15" opacity="0.25">&#x1F987;</text>

  <!-- ========== BUS STOP / OUTSIDE ========== -->
  <text x="250" y="105" class="area-label">OUTSIDE THE WALL</text>

  <!-- Bus Stop -->
  <rect x="60" y="120" width="220" height="80" class="room-outdoor" style="stroke: #1a5a1a;"/>
  <text x="170" y="145" class="room-label" style="fill: #2a6a2a;">&#x1F68C; BUS STOP</text>
  <text x="170" y="163" class="room-desc">Where it all begins...</text>
  <text x="170" y="178" class="item">You arrive with: &#x1F3AB; Tokens, &#x231A; Watch</text>
  <text x="170" y="193" class="note">"Welcome novice. You are playing one of the</text>

  <!-- Forest & Road -->
  <rect x="320" y="120" width="220" height="80" class="room-outdoor" style="stroke: #1a5a1a;"/>
  <text x="430" y="145" class="room-label" style="fill: #2a6a2a;">&#x1F332; FOREST &amp; ROAD</text>
  <text x="430" y="163" class="room-desc">Outside the wall perimeter</text>
  <text x="430" y="178" class="note">You cannot re-enter through</text>
  <text x="430" y="191" class="note">the front gate once inside</text>

  <!-- Bus to Forest connector -->
  <line x1="280" y1="160" x2="320" y2="160" class="connector"/>

  <!-- Drive Gate (outside) -->
  <rect x="580" y="120" width="200" height="80" class="room-outdoor"/>
  <text x="680" y="145" class="room-label" style="fill: #2a6a2a;">DRIVE GATE</text>
  <text x="680" y="163" class="room-desc">Speaker with button by gate</text>
  <text x="680" y="178" class="room-desc">Say "hi" to open!</text>
  <text x="680" y="193" class="note">"Now you are in, but will you ever get out?"</text>

  <!-- Forest to Gate -->
  <line x1="540" y1="160" x2="580" y2="160" class="connector"/>
  <text x="560" y="155" class="dir-label">E</text>

  <!-- ========== THE WALL ========== -->
  <rect x="50" y="225" width="1100" height="510" fill="none" stroke="#2a6a2a" stroke-width="4" rx="6"/>
  <text x="600" y="250" class="wall-label">&#x2550;&#x2550;&#x2550; THE WALL &#x2550;&#x2550;&#x2550;  10 ft tall, too slick to climb, electrified gate</text>

  <!-- Gate into wall -->
  <line x1="680" y1="200" x2="680" y2="225" class="connector"/>
  <text x="695" y="215" class="dir-label">&#x2193;</text>

  <!-- ========== INSIDE THE WALL - Lawn Grid ========== -->
  <text x="600" y="278" class="area-label">MANSION GROUNDS  (7&#xD7;7 lawn grid inside wall)</text>

  <!-- General Lawn description -->
  <rect x="350" y="290" width="300" height="60" class="room-outdoor" opacity="0.4"/>
  <text x="500" y="312" class="room-label" style="fill: #2a6a2a;" font-size="14">THE LAWN</text>
  <text x="500" y="328" class="room-desc">Grid coordinates: east 2-8, north 2-8</text>
  <text x="500" y="342" class="note">"You're on the lawn of the mansion."</text>

  <!-- DRIVE GATE inside (8,5) -->
  <rect x="900" y="290" width="210" height="55" class="room-outdoor"/>
  <text x="1005" y="312" class="room-label" style="fill: #2a6a2a;" font-size="14">GATE (inside)</text>
  <text x="1005" y="328" class="room-desc">Locked electronically from inside</text>
  <text x="1005" y="340" class="danger-text">No escape this way!</text>

  <!-- Gate outside to inside -->
  <line x1="780" y1="160" x2="1005" y2="160" class="connector" stroke-opacity="0.4"/>
  <line x1="1005" y1="160" x2="1005" y2="225" class="connector" stroke-opacity="0.4"/>
  <line x1="1005" y1="225" x2="1005" y2="290" class="connector"/>

  <!-- DRIVEWAY (7,5) -->
  <rect x="670" y="290" width="195" height="55" class="room-outdoor"/>
  <text x="768" y="312" class="room-label" style="fill: #2a6a2a;" font-size="14">DRIVEWAY</text>
  <text x="768" y="328" class="room-desc">Gate in wall to east</text>
  <text x="768" y="340" class="note">Oil truck parks here</text>

  <!-- Driveway to Gate -->
  <line x1="865" y1="317" x2="900" y2="317" class="connector"/>
  <text x="883" y="312" class="dir-label">E</text>

  <!-- PARKING (7,6) -->
  <rect x="670" y="375" width="195" height="55" class="room-outdoor"/>
  <text x="768" y="397" class="room-label" style="fill: #2a6a2a;" font-size="14">PARKING SPACE</text>
  <text x="768" y="413" class="item">&#x1F69A; Oil truck appears here (timed)</text>

  <!-- Driveway to Parking -->
  <line x1="768" y1="345" x2="768" y2="375" class="connector"/>
  <text x="780" y="363" class="dir-label">S</text>

  <!-- FRONT DOOR (5,4) -->
  <rect x="350" y="380" width="260" height="75" class="room-outdoor"/>
  <text x="480" y="403" class="room-label" style="fill: #2a6a2a;">&#x1F3DA; FRONT DOOR</text>
  <text x="480" y="420" class="room-desc">Outside a large door in front of an old mansion</text>
  <text x="480" y="436" class="note">Knock or ring bell &#x2192; "Welcome, cheese lover."</text>
  <text x="480" y="449" class="note">&#x2191; Enter door &#x2192; FOYER (see mansion map)</text>

  <!-- FRONT WALK (5,3) -->
  <rect x="400" y="490" width="160" height="45" class="room-outdoor"/>
  <text x="480" y="516" class="room-label" style="fill: #2a6a2a;" font-size="14">FRONT WALK</text>

  <line x1="480" y1="455" x2="480" y2="490" class="connector"/>
  <text x="492" y="475" class="dir-label">S</text>

  <!-- FRONT GATE (5,2) -->
  <rect x="380" y="565" width="200" height="55" class="room-danger"/>
  <text x="480" y="587" class="room-label" font-size="14">FRONT GATE</text>
  <text x="480" y="604" class="danger-text">&#x26A1; Upper part is electrified!</text>

  <line x1="480" y1="535" x2="480" y2="565" class="connector"/>
  <text x="492" y="553" class="dir-label">S</text>

  <!-- IVY WALL (5,6) -->
  <rect x="350" y="645" width="260" height="65" class="room-outdoor"/>
  <text x="480" y="668" class="room-label" style="fill: #2a6a2a;">&#x1F33F; IVY WALL</text>
  <text x="480" y="685" class="room-desc">Ivy on the walls of the house</text>
  <text x="480" y="700" class="note">Climb ivy &#x2192; BALCONY (see mansion map)</text>

  <!-- Connection from lawn area -->
  <line x1="480" y1="350" x2="480" y2="380" class="connector" stroke-opacity="0.4"/>
  <line x1="480" y1="620" x2="480" y2="645" class="connector" stroke-opacity="0.4"/>

  <!-- Lawn connector from walk area to ivy area -->
  <path d="M 350 520 L 300 520 L 300 675 L 350 675" class="connector" stroke-opacity="0.3"/>
  <text x="285" y="600" class="dir-label" style="font-size: 9px;" transform="rotate(-90, 285, 600)">lawn grid</text>

  <!-- Lawn connector from driveway area down -->
  <path d="M 670 400 L 640 400 L 640 675 L 610 675" class="connector" stroke-opacity="0.3"/>

  <!-- GARDEN (3,7) -->
  <rect x="85" y="400" width="190" height="80" class="room-outdoor"/>
  <text x="180" y="425" class="room-label" style="fill: #2a6a2a;">&#x1F33A; GARDEN</text>
  <text x="180" y="443" class="room-desc">Old, dried, hard land</text>
  <text x="180" y="458" class="treasure">&#x1F33C; Orchid (plant seed, water with</text>
  <text x="180" y="471" class="treasure">bathwater &#x2192; orchid sprouts!)</text>

  <!-- Garden lawn connector -->
  <line x1="275" y1="440" x2="300" y2="440" class="connector" stroke-opacity="0.3"/>

  <!-- GRAVE (8,8) -->
  <rect x="85" y="510" width="190" height="120" class="room-danger"/>
  <text x="180" y="533" class="room-label">&#x26B0; GRAVE</text>
  <text x="180" y="550" class="room-desc">There is a fresh grave here</text>
  <text x="180" y="566" class="room-desc">Dig &#x2192; open grave &#x2192; dig more</text>
  <text x="180" y="582" class="room-desc">&#x2192; oil pipe &amp; lever!</text>
  <text x="180" y="598" class="treasure">&#x1F9B4; Bone (treasure, in grave)</text>
  <text x="180" y="614" class="note">Pull lever &#x2192; oil seeps &#x2192;</text>
  <text x="180" y="626" class="note">oil truck arrives to fix it!</text>

  <!-- Grave lawn connector -->
  <line x1="275" y1="570" x2="300" y2="570" class="connector" stroke-opacity="0.3"/>

  <!-- ========== OIL TRUCK SEQUENCE ========== -->
  <rect x="670" y="460" width="195" height="70" class="room" style="stroke: #8a5a1a;"/>
  <text x="768" y="483" class="room-label" style="fill: #8a5a1a;">&#x1F69A; OIL TRUCK</text>
  <text x="768" y="500" class="room-desc">Panel truck, "Oil line fixit"</text>
  <text x="768" y="517" class="room-desc">Open the back door</text>

  <!-- Parking to Truck -->
  <line x1="768" y1="430" x2="768" y2="460" class="connector-special"/>
  <text x="780" y="448" class="dir-label">&#x2193;</text>

  <!-- IN TRUCK -->
  <rect x="670" y="560" width="195" height="65" class="room" style="stroke: #8a5a1a;"/>
  <text x="768" y="583" class="room-label" style="fill: #8a5a1a;">INSIDE TRUCK</text>
  <text x="768" y="600" class="room-desc">Empty panel truck interior</text>
  <text x="768" y="615" class="note">Close the door and wait...</text>

  <!-- Oil Truck to Inside Truck -->
  <line x1="768" y1="530" x2="768" y2="560" class="connector-special"/>
  <text x="780" y="548" class="dir-label">enter</text>

  <!-- ========== ESCAPE! ========== -->
  <rect x="900" y="545" width="250" height="100" rx="12" fill="#fffdf0" stroke="#9a7a00" stroke-width="2"/>
  <text x="1025" y="570" class="treasure" font-size="16">&#x1F3C6; FREEDOM!</text>
  <text x="1025" y="588" class="room-desc">"VaVoom! Bump bump! You feel</text>
  <text x="1025" y="602" class="room-desc">yourself being driven out of the yard."</text>
  <text x="1025" y="620" class="note">Sell the land or donate it?</text>
  <text x="1025" y="635" class="note">&#x1F98C; Beware the bull moose if you sell!</text>

  <!-- Inside Truck to Escape -->
  <line x1="865" y1="592" x2="900" y2="592" class="connector-escape"/>

  <!-- ========== LEGEND ========== -->
  <rect x="70" y="770" width="500" height="95" fill="#f8f6f0" stroke="#5a4a2a" stroke-width="1" rx="8"/>
  <text x="320" y="792" class="room-label" font-size="14">LEGEND</text>

  <rect x="90" y="802" width="24" height="14" class="room-outdoor"/>
  <text x="125" y="814" class="legend-text" text-anchor="start">Outdoor area</text>

  <rect x="90" y="824" width="24" height="14" class="room-danger"/>
  <text x="125" y="836" class="legend-text" text-anchor="start">Dangerous area</text>

  <rect x="90" y="846" width="24" height="14" class="room" style="stroke: #8a5a1a;"/>
  <text x="125" y="858" class="legend-text" text-anchor="start">Truck / vehicle</text>

  <line x1="270" y1="812" x2="310" y2="812" class="connector"/>
  <text x="320" y="816" class="legend-text" text-anchor="start">Normal passage</text>

  <line x1="270" y1="834" x2="310" y2="834" class="connector-special"/>
  <text x="320" y="838" class="legend-text" text-anchor="start">Special connection</text>

  <text x="280" y="858" class="treasure">&#x1F48E;</text>
  <text x="320" y="858" class="legend-text" text-anchor="start">Treasure</text>

  <!-- ========== OIL TRUCK TIMELINE ========== -->
  <rect x="70" y="885" width="1060" height="130" fill="#f8f6f0" stroke="#8a5a1a" stroke-width="1" rx="8"/>
  <text x="600" y="910" class="room-label" style="fill: #8a5a1a;" font-size="14">&#x1F69A; THE OIL TRUCK ESCAPE SEQUENCE</text>

  <text x="100" y="935" class="room-desc" style="text-anchor: start;">1. Dig at the grave (8,8) until you find the oil pipe</text>
  <text x="100" y="952" class="room-desc" style="text-anchor: start;">2. Pull the lever &#x2192; oil seeps out</text>
  <text x="100" y="969" class="room-desc" style="text-anchor: start;">3. Wait... an oil truck arrives at the drive gate, parks on the driveway</text>
  <text x="100" y="986" class="room-desc" style="text-anchor: start;">4. Driver goes to the grave to fix the pipe (you can't interact with him)</text>
  <text x="600" y="935" class="room-desc" style="text-anchor: start;">5. Open the back of the truck</text>
  <text x="600" y="952" class="room-desc" style="text-anchor: start;">6. Get in the truck (drop everything first!)</text>
  <text x="600" y="969" class="room-desc" style="text-anchor: start;">7. Close the door from inside</text>
  <text x="600" y="986" class="room-desc" style="text-anchor: start;">8. Wait for the driver to return &#x2192; &#x1F3C6; ESCAPE!</text>
  <text x="600" y="1003" class="note" style="text-anchor: start;">(If the door is open, you fall out the back. Timing is everything!)</text>

  <!-- ========== FLAVOR ========== -->
  <text x="600" y="1050" class="note" opacity="0.5" font-size="11">"You aren't the HULK or Dwight Stones."  &#x2022;  "You watched Superman too many times!"</text>
  <text x="600" y="1070" class="subtitle" opacity="0.4" font-size="10">Mapped from haunt_game_source.txt ~ John Laird, 1979-1983</text>

  <!-- Decorations -->
  <text x="1140" y="42" class="whimsy" font-size="22" opacity="0.2">&#x1F47B;</text>
  <text x="50" y="1070" class="whimsy" font-size="18" opacity="0.15">&#x1F480;</text>
  <text x="1150" y="1070" class="whimsy" font-size="16" opacity="0.15">&#x1F578;</text>

</svg>
